<title>Backup Power Pro · Opening your saved quote walk</title>
<meta name="theme-color" content="#0b1f3b" />
<style>
  html,body{margin:0;min-height:100%;background:#0b1f3b;color:#fff;font-family:system-ui,-apple-system,sans-serif}
  main{min-height:100vh;display:grid;place-content:center;text-align:center;padding:24px}
  a{color:#ffba00;font-weight:700}
</style>
<script>
  (function () {
    function recover() {
      function showRecovery() {
        var heading = document.querySelector('[data-alias-status]');
        var copy = document.querySelector('[data-alias-recovery-copy]');
        var notice = document.querySelector('.qw-script-recovery');
        if (heading) heading.textContent = "We couldn't open this saved Quote Walk.";
        if (copy) copy.textContent = 'Use your original saved Quote Walk link, or call ';
        // A reload of a scrubbed, ambiguous link cannot select its saved request.
        var reload = notice && notice.querySelector('button');
        if (reload) reload.remove();
        document.documentElement.classList.remove('js');
        document.documentElement.classList.add('no-js');
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showRecovery, { once: true });
      else showRecovery();
    }
    var token = window.__BPP_WALK_TOKEN;
    var capability = window.__BPP_CAPABILITY_ENTRY;
    // Invalid explicit input must never select an older tab credential.
    if (window.__BPP_INVALID_CAPABILITY_ENTRY !== false || typeof capability !== 'boolean'
        || typeof token !== 'string' || (token && !/^[a-zA-Z0-9_-]{32,160}$/.test(token))
        || (capability && !token)) { recover(); return; }
    var target = new URL(window.location.href);
    target.pathname = '/walk-v2/connection.html';
    target.searchParams.delete('t');
    // The next document needs this exact captured credential even without storage.
    if (token) target.searchParams.set('t', token);
    var relative = target.pathname + target.search + target.hash;
    if (window.__QW_NAVIGATE__) window.__QW_NAVIGATE__(relative);
    else window.location.replace(relative);
  })();
</script>
</head>
<body>
<main>
  <p data-alias-status>Opening your saved Quote Walk.</p>
  <div class="qw-no-js-note qw-script-recovery" role="alert"><span data-alias-recovery-copy>JavaScript is required to open this saved Quote Walk safely. Your saved answers remain on file. Turn it on and reload, or call </span><a href="tel:+18648637800">(864) 863-7800</a>.</div>
</main>
</body>
